name: diary
description: A new Flutter project called Diary.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  pine: ^1.0.4
  flutter_bloc: ^9.1.1
  provider: ^6.1.5
  json_annotation: ^4.11.0
  uuid: ^4.5.1
  auto_route: ^11.1.0
  intl: ^0.20.2
  drift: ^2.32.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sensors_plus: ^7.0.0
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  flutter_secure_storage: ^10.3.1
  crypto: ^3.0.0
  latlong2: ^0.9.1
  mapbox_maps_flutter: ^2.25.0
  fl_chart: ^0.69.0
  dio: ^5.10.0
  share_plus: ^11.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.5.2
  auto_route_generator: ^10.5.0
  drift_dev: ^2.32.0
  json_serializable: ^6.13.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
  windows:
    generate: true
  web:
    generate: true


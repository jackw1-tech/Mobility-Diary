server {
    listen 80;
    server_name _;

    client_max_body_size 30m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django_api http://web:8000;
    set $object_storage http://minio:9000;

    location /mobility-trips/ {
        proxy_pass $object_storage;
        proxy_http_version 1.1;
        # $host tronca la porta anche se il client la include nell'header Host,
        # rompendo la firma AWS SigV4 (che la include) quando si gira su una
        # porta non standard (es. sviluppo locale su :8080). $http_host la
        # preserva esattamente come inviata dal client.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass $django_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}

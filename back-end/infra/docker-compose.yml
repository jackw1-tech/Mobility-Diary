services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_healthy

  frontend:
    build:
      context: ../../web
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ../ninja
    scale: 1
    restart: unless-stopped
    command: >
      sh -c "gunicorn config.asgi:application
      -k uvicorn.workers.UvicornWorker
      --workers ${WEB_CONCURRENCY:-2}
      --bind 0.0.0.0:8000"
    env_file:
      - .env
    volumes:
      - ../ninja:/app
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/mobility/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      seed-demo-trip:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../ninja
    scale: 2
    restart: unless-stopped
    command: >
      sh -c "celery -A config worker -l info
      --concurrency ${WORKER_CONCURRENCY:-3}"
    env_file:
      - .env
    volumes:
      - ../ninja:/app
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$(hostname) | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    build:
      context: ../ninja
    restart: "no"
    command: python manage.py migrate --noinput
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - ../ninja:/app
    depends_on:
      db:
        condition: service_healthy

  demo-user-init:
    build:
      context: ../ninja
    restart: "no"
    command: python manage.py ensure_demo_accounts
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - ../ninja:/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  seed-demo-trip:
    build:
      context: ../ninja
    restart: "no"
    command: python manage.py seed_demo_trip
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ../ninja:/app
      - ./demo-seed:/demo-seed:ro
    depends_on:
      demo-user-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6381:6379"
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  db:
    build:
      context: ./postgres
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mobility}
      POSTGRES_USER: ${POSTGRES_USER:-mobility}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mobility}
    ports:
      - "127.0.0.1:5433:5432"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The image starts a temporary Unix-socket-only server while running the
      # init scripts. Checking TCP prevents dependent services from starting
      # during the final PostgreSQL restart.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-mobility} -d ${POSTGRES_DB:-mobility}"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 120s

  
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20


  minio-init:
    image: quay.io/minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET_NAME:-mobility-trips}
      "

volumes:
  postgres_data:
  minio_data:

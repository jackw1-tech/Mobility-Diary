services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      web:
        condition: service_healthy

  web:
    build:
      context: ../ninja
    scale: 2
    restart: unless-stopped
    command: >
      sh -c "gunicorn config.asgi:application
      -k uvicorn.workers.UvicornWorker
      --workers ${WEB_CONCURRENCY:-2}
      --bind 0.0.0.0:8000"
    env_file:
      - .env
    volumes:
      - ../ninja:/app
      - ../../manual_har:/app/manual_har:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/mobility/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../ninja
    scale: 2
    restart: unless-stopped
    command: >
      sh -c "celery -A config worker -l info
      --concurrency ${WORKER_CONCURRENCY:-1}"
    env_file:
      - .env
    volumes:
      - ../ninja:/app
      - ../../manual_har:/app/manual_har:ro
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$(hostname) | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ../ninja
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file:
      - .env
    volumes:
      - ../ninja:/app
      - ../../manual_har:/app/manual_har:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    build:
      context: ../ninja
    restart: "no"
    command: python manage.py migrate --noinput
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - ../ninja:/app
      - ../../manual_har:/app/manual_har:ro
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  db:
    build:
      context: ./postgres
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mobility}
      POSTGRES_USER: ${POSTGRES_USER:-mobility}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mobility}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mobility} -d ${POSTGRES_DB:-mobility}"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 120s

  # Object storage S3-compatibile per lo sviluppo locale (REPORT_STRATEGIA_INGESTION_ASINCRONA.md D7).
  # In deploy su Railway viene sostituito da Railway Buckets cambiando solo le env var S3_*.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Crea il bucket locale al primo avvio, poi esce. Idempotente (mb --ignore-existing).
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET_NAME:-mobility-trips}
      "

volumes:
  postgres_data:
  minio_data:

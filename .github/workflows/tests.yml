name: Test suite

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: back-end
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-with-at-least-32-bytes
      POSTGRES_DB: mobility
      POSTGRES_USER: mobility
      POSTGRES_PASSWORD: mobility
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6381/0
      CELERY_BROKER_URL: redis://127.0.0.1:6381/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6381/1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back-end/ninja/requirements.txt

      - name: Configure integration services
        run: cp infra/.env.example infra/.env

      - name: Start PostgreSQL, Redis and MinIO
        working-directory: back-end/infra
        run: |
          docker compose up -d db redis minio
          docker compose up minio-init

      - name: Install backend dependencies
        run: python -m pip install -r ninja/requirements.txt

      - name: Run backend tests
        working-directory: back-end/ninja
        run: pytest -q

      - name: Stop integration services
        if: always()
        working-directory: back-end/infra
        run: docker compose down -v

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/diary
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
